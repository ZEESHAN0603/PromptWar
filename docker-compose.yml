version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventpilot-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/eventpilot}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:postgres@localhost:5432/eventpilot}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-eventpilot-ai-development-jwt-secret-min-32-chars}
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service
    restart: unless-stopped
    networks:
      - eventpilot-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: eventpilot-ai-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-development-internal-ai-secret-key-32-chars}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BACKEND_INTERNAL_URL=http://backend:5000
    restart: unless-stopped
    networks:
      - eventpilot-network

networks:
  eventpilot-network:
    driver: bridge
